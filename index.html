<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>월간 노래 배달</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Entry background photo (screens 1-2), with a hand-drawn wobbly frame. -->
    <div id="entry-photo" aria-hidden="true">
      <img src="./public/images/bg-entry.webp" alt="" />
      <svg class="frame" viewBox="0 0 1125 628" preserveAspectRatio="none">
        <defs>
          <filter id="rough-frame" x="-10%" y="-16%" width="120%" height="132%">
            <feTurbulence type="fractalNoise" baseFrequency="0.03 0.05"
                          numOctaves="2" seed="7" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="10"
                               xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>
        <rect x="0" y="0" width="1125" height="628" rx="26" ry="26" fill="none"
              stroke="#111" stroke-width="7" vector-effect="non-scaling-stroke"
              filter="url(#rough-frame)" />
      </svg>
    </div>

    <div id="app"></div>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
